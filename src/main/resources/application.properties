spring.application.name=cronist-dave-adapter
server.port=8089

# actuator
management.endpoints.web.base-path=/monitoring
management.endpoints.web.exposure.include=health

# Observatory analytics database, source of the line crossings
spring.datasource.hikari.connection-timeout=10000
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/analytics}
spring.datasource.username=${DB_USERNAME:analytics}
spring.datasource.password=${DB_PASSWORD:analytics}

# How long to wait between two transfer runs
adapter.transfer-interval=5m
# Has to be the time zone DAVe runs in, DAVe stores local times and the date of a Zaehlung is derived from it
adapter.zone=Europe/Berlin
# Subtract bicycles from pedestrians: Observatory tracks a cyclist as a bicycle and a person
adapter.correct-bicycle=true

# Direction of a counting line -> number of the Knotenarm in DAVe
adapter.intersection-mapping.N=1
adapter.intersection-mapping.E=2
adapter.intersection-mapping.S=3
adapter.intersection-mapping.W=4
adapter.intersection-mapping.NE=5
adapter.intersection-mapping.SE=6
adapter.intersection-mapping.SW=7
adapter.intersection-mapping.NW=8

adapter.cronist.url=${CRONIST_URL:http://localhost:8081/cronist}
adapter.dave.url=${DAVE_URL:http://localhost:8080}
# Stadtbezirk of the created Zaehlstellen, areas in Cronist have none
adapter.dave.stadtbezirk-nummer=0
# Vehicle classes the Zaehlungen are created with. Cronist only counts cars for now, see CountingLineJob in Cronist
adapter.dave.kategorien=PKW
# ACCOMPLISHED: Fachadmin releases the Zaehlung in DAVe, ACTIVE: released right away
adapter.dave.final-status=ACCOMPLISHED

