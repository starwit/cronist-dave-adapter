spring.application.name=cronist-dave-adapter
server.port=8089

# actuator
management.endpoints.web.base-path=/monitoring
management.endpoints.web.exposure.include=health
# show the status of the components cronist and dave, their details stay hidden
management.endpoint.health.show-components=always

# Observatory analytics database, source of the line crossings
spring.datasource.hikari.connection-timeout=10000
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/analytics}
spring.datasource.username=${DB_USERNAME:analytics}
spring.datasource.password=${DB_PASSWORD:analytics}

# How long to wait between two transfer runs
adapter.transfer-interval=5m
# Has to be the time zone DAVe runs in, DAVe stores local times and the date of a Zaehlung is derived from it
adapter.zone=Europe/Berlin
# Subtract bicycles from pedestrians: Observatory tracks a cyclist as a bicycle and a person
adapter.correct-bicycle=true

# Direction of a counting line -> number of the Knotenarm in DAVe
adapter.intersection-mapping.N=1
adapter.intersection-mapping.E=2
adapter.intersection-mapping.S=3
adapter.intersection-mapping.W=4
adapter.intersection-mapping.NE=5
adapter.intersection-mapping.SE=6
adapter.intersection-mapping.SW=7
adapter.intersection-mapping.NW=8

adapter.cronist.url=${CRONIST_URL:http://localhost:8081/cronist}
adapter.dave.url=${DAVE_URL:http://localhost:8080}

# Called periodically with the credentials of the transfer to check reachability and credentials, reported by the
# health check. Empty to disable the check of a service.
adapter.credential-check-interval=5m
adapter.cronist.test-url=${CRONIST_TEST_URL:http://localhost:8081/cronist/api/observationarea}
adapter.dave.test-url=${DAVE_TEST_URL:http://localhost:8080/api/dave-backend-service/cityinformation/all}
# Stadtbezirk of the created Zaehlstellen whose Stadtteil is unknown or not mapped, areas in Cronist have none.
# Number of the Stadtbezirk in DAVe, table city_district: 130 is Stadtmitte of Wolfsburg
adapter.dave.stadtbezirk-nummer=130
# Stadtteil found by the GeoServer -> number of the Stadtbezirk in DAVe. Brackets keep umlauts, hyphens and blanks.
#adapter.dave.stadtbezirk-mapping[Stadtmitte]=130
#adapter.dave.stadtbezirk-mapping[Alt-Wolfsburg]=101
#adapter.dave.stadtbezirk-mapping[Kästorf]=115

# WFS to find the Stadtteil of an observation area by its coordinates, empty to disable.
# Default: Stadt- und Ortsteile of the city of Wolfsburg
adapter.geoserver.url=${GEOSERVER_URL:https://gdiservices.stadt.wolfsburg.de/geoserver/opendata_stadtteile/wfs}
adapter.geoserver.type-name=opendata_stadtteile:stadtteile
# Vehicle classes the Zaehlungen are created with. Cronist only counts cars for now, see CountingLineJob in Cronist
adapter.dave.kategorien=PKW
# ACCOMPLISHED: Fachadmin releases the Zaehlung in DAVe, ACTIVE: released right away
adapter.dave.final-status=ACTIVE

